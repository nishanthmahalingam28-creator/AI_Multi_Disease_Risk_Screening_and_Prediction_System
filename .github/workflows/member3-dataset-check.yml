name: Member 3A dataset verification
on:
  push:
    branches: [member3]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install data dependencies
        run: python -m pip install pandas openpyxl
      - name: Verify datasets
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          import pandas as pd

          def report(path, target, identifier=None):
              p=Path(path)
              print("\n=== DATASET:", path, "===")
              print("exists:", p.exists(), "size_bytes:", p.stat().st_size if p.exists() else None)
              df=pd.read_csv(p) if p.suffix.lower()=='.csv' else pd.read_excel(p)
              print("shape:", df.shape)
              print("columns:", json.dumps(df.columns.tolist(), ensure_ascii=False))
              print("dtypes:", json.dumps({k:str(v) for k,v in df.dtypes.items()}, ensure_ascii=False))
              print("missing_count:", json.dumps(df.isna().sum().to_dict(), ensure_ascii=False))
              print("missing_percent:", json.dumps((df.isna().mean()*100).round(4).to_dict(), ensure_ascii=False))
              print("duplicate_rows:", int(df.duplicated().sum()))
              print("target:", target)
              print("target_counts:", json.dumps(df[target].value_counts(dropna=False).to_dict(), ensure_ascii=False))
              print("target_percent:", json.dumps((df[target].value_counts(normalize=True, dropna=False)*100).round(4).to_dict(), ensure_ascii=False))
              if identifier:
                  print("identifier:", identifier)
                  print("identifier_unique:", int(df[identifier].nunique(dropna=False)))
                  print("identifier_duplicates:", int(df[identifier].duplicated().sum()))
                  print("identifier_sample:", json.dumps(df[identifier].astype(str).head(10).tolist()))
              print("head:", df.head(3).to_json(orient='records'))
              print("constant_columns:", [c for c in df.columns if df[c].nunique(dropna=False)<=1])
              print("unique_counts:", json.dumps({c:int(df[c].nunique(dropna=False)) for c in df.columns}, ensure_ascii=False))
              return df

          a=report('dataset/synthetic_asthma_dataset.csv','Has_Asthma','Patient_ID')
          print("ASTHMA_CONTROL_CROSSTAB:")
          print(pd.crosstab(a['Has_Asthma'], a['Asthma_Control_Level'], dropna=False).to_string())

          p=report('dataset/Parkinsons_Disease_Dataset.xlsx','status','name')
          name=p['name'].astype(str)
          subject=name.str.extract(r'(S\\d+)', expand=False)
          print("PARKINSON_SUBJECT_ID_REGEX_MATCHED:", int(subject.notna().sum()))
          print("PARKINSON_UNIQUE_SUBJECTS_REGEX:", int(subject.nunique(dropna=True)))
          print("PARKINSON_RECORDINGS_PER_SUBJECT_TOP20:", json.dumps(subject.value_counts().head(20).to_dict()))
          print("PARKINSON_NAME_TARGET_CROSSTAB:")
          print(pd.crosstab(name,p['status']).to_string())
          print("PARKINSON_NUMERIC_CORRELATIONS_WITH_TARGET:")
          print(p.select_dtypes(include='number').corr(numeric_only=True)['status'].sort_values(ascending=False).to_string())
          PY
